function scorePlan(plan, a) {
  let sc = 0;
  if (a.budget==="low") sc += plan.gb<=3?35:plan.gb<=10?10:-10;
  if (a.budget==="mid") sc += plan.gb>=3&&plan.gb<=10?35:plan.gb<=15?15:0;
  if (a.budget==="high") sc += plan.gb>=10&&plan.gb<=30?35:plan.gb>=5?10:0;
  if (a.budget==="any") sc += plan.gb>=30||plan.gb>=9999?35:plan.gb>=20?20:5;
  // 機種購入予定
  if (a.usage==="heavy") sc += ["docomo","au","SoftBank"].includes(plan.carrier)?25:-5; // 最新機種→大手優先
  if (a.usage==="light") sc += 5; // そのまま使う→どこでもOK
  if (a.usage==="call") sc += plan.cat==="mvno"?15:plan.cat==="sub"?10:5; // 安い機種→格安・サブ優先
  if (a.usage==="data") sc += 5; // 未定→フラット
  if (a.call==="none") sc += plan.callType.includes("従量")?5:0;
  if (a.call==="light") sc += plan.callType.includes("5分")?20:plan.callType.includes("従量")?8:15;
  if (a.call==="heavy") sc += (plan.callType.includes("無制限")||plan.callType.includes("Rakuten"))?30:plan.callType.includes("5分")?12:0;
  if (a.call==="work") sc += (plan.callType.includes("無制限")||plan.callType.includes("Rakuten"))?35:plan.callType.includes("5分")?15:0;
  if (a.support==="store") sc += plan.support==="店舗"?25:-15;
  if (a.support==="online") sc += plan.support==="オンライン"?10:5;
  if (a.support==="none") sc += 5;
  if (a.family==="yes") sc += ["docomo","au","SoftBank","UQ mobile","Y!mobile"].includes(plan.carrier)?15:0;
  if (a.age==="senior") { if(plan.support==="店舗") sc+=15; if(plan.cat==="mvno") sc-=10; }
  if (a.age==="young" && plan.price<=2000) sc+=10;
  // U18・U12は18歳以下以外には表示しない
  const isYouthPlan = ["au_u18_s","au_u18_l","sb_debut4","sb_debut20"].includes(plan.id);
  if (isYouthPlan && a.age!=="young") sc -= 999;
  if (isYouthPlan && a.age==="young") sc += 30;
  // シニアプランは60歳以上以外には表示しない
  const isSeniorPlan = ["au_senior"].includes(plan.id);
  if (isSeniorPlan && a.age!=="senior") sc -= 999;
  if (isSeniorPlan && a.age==="senior") sc += 30;
  return sc;
}

function recommendOptions(plan, a) {
  const rec = [];
  const hasFullCall = plan.callType.includes("無制限")||plan.callType.includes("Rakuten");
  const isSeniorPlan = plan.id === "au_senior";
  let callOpts = OPTIONS.call.items.filter(o=>o.carrier===plan.carrier);
  if (!hasFullCall && callOpts.length && (a.call==="heavy"||a.call==="work"||a.call==="light")) {
    if (isSeniorPlan) {
      const opts = callOpts.filter(o=>o.seniorOnly);
      if (opts.length) rec.push({ category:"call", items: opts });
    } else {
      const opts = callOpts.filter(o=>!o.seniorOnly);
      rec.push({ category:"call", items: a.call==="light" ? opts.slice(0,1) : opts });
    }
  }
  return rec;
}

function diagnosePhone(answers) {
  const priority = answers.priority || [];
  const { size, budget, os } = answers;
  const scored = SMARTPHONES.map(p => {
    let score = 0, penalty = 0;
    if (os==="iOS"     && p.os!=="iOS")     penalty += 10;
    if (os==="Android" && p.os!=="Android") penalty += 10;
    if (budget==="low"  && p.budget!=="low")  penalty += 5;
    if (budget==="mid"  && p.budget==="high") penalty += 3;
    if (size==="compact" && p.size==="large")   penalty += 2;
    if (size==="large"   && p.size==="compact") penalty += 1;
    if (priority.includes("camera"))      score += p.camera      * 2;
    if (priority.includes("battery"))     score += p.battery     * 2;
    if (priority.includes("performance")) score += p.performance * 2;
    if (priority.length===0) score += (p.camera + p.battery + p.performance);
    return { ...p, score: score - penalty };
  }).sort((a,b)=>b.score-a.score);
  return scored.slice(0,5);
}

async function fetchAIResult(answers, topPlans) {
  const qa = QUESTIONS.map(q => {
    const c = q.opts.find(o=>o.val===answers[q.id]);
    return `・${q.q} → ${c?.label||"未回答"}`;
  }).join("\n");
  const planList = topPlans.slice(0,3).map((p,i)=>
    `プラン${["A","B","C"][i]}: ${p.carrier}「${p.name}」月${p.price.toLocaleString()}円 (${p.gb>=9999?"無制限":p.gb+"GB"}, ${p.callType})`
  ).join("\n");
  const res = await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST", headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ model:"claude-sonnet-4-20250514", max_tokens:600,
      messages:[{ role:"user", content:
        `あなたは携帯ショップのAIアシスタントです。お客様の回答をもとに提案文を書いてください。\n\n【お客様の回答】\n${qa}\n\n【おすすめプラン】\n${planList}\n\nJSONのみ返してください:\n{"headline":"一言キャッチ(20文字以内)","summary":"選定理由(60-80文字・です・ます調)","comments":["プランAひとこと(40文字以内)","プランBひとこと(40文字以内)","プランCひとこと(40文字以内)"]}`
      }]
    })
  });
  const data = await res.json();
  const text = data.content?.[0]?.text||"";
  try { const s=text.indexOf("{"),e=text.lastIndexOf("}"); return JSON.parse(text.slice(s,e+1)); }
  catch { return null; }
}

      <AdBanner slotKey="top"/>
      <div style={{padding:"36px 20px 28px",textAlign:"center"}}>
        <div style={{
          display:"inline-block",fontSize:10,fontWeight:700,letterSpacing:3,
          color:C.accent,background:C.accentG,border:`1px solid ${C.accent}44`,
          padding:"5px 14px",borderRadius:20,marginBottom:18,
        }}>ケータイショップ店員おすすめ</div>
        <div style={{
          fontSize:44,fontWeight:900,lineHeight:1.15,letterSpacing:-1,marginBottom:12,
          background:`linear-gradient(135deg,${C.text} 0%,${C.accent} 100%)`,
          WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent",
        }}>スマホプラン<br/>かんたん診断</div>
        <div style={{fontSize:13,color:C.sub,lineHeight:1.8,marginBottom:24}}>
          AIがあなたに合わせて最適なプランを提案します
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:24}}>
          {[["🤖","AIが最適プランを選定"],["📊","主要キャリア対応"],["👨‍💼","現役店員が監修"],["⏱️","所要時間 1分以内"]].map(([icon,text])=>(
            <div key={text} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 8px",textAlign:"center"}}>
              <div style={{fontSize:22,marginBottom:6}}>{icon}</div>
              <div style={{fontSize:11,color:C.sub,lineHeight:1.4}}>{text}</div>
            </div>
          ))}
        </div>
        <button onClick={()=>setScreen("quiz")} style={{
          width:"100%",padding:"16px",borderRadius:12,border:"none",
          background:`linear-gradient(135deg,${C.accent},#2563eb)`,
          color:"#fff",fontSize:16,fontWeight:900,cursor:"pointer",fontFamily:"inherit",
        }}>診断スタート →</button>
        <div style={{fontSize:12,color:C.green,marginTop:10,fontWeight:700,textAlign:"center"}}>
          ✓ 登録不要・完全無料
        </div>
        <div style={{marginTop:16}}>
          <button onClick={()=>{ setTab("phone"); setPhoneScreen("top"); setPhoneSubTab("diagnose"); }} style={{
            width:"100%",padding:"12px",borderRadius:12,
            border:`1px solid ${C.accent}`,background:C.accentG,
            color:C.accent,fontSize:13,fontWeight:900,cursor:"pointer",fontFamily:"inherit",
          }}>📱 おすすめスマホを診断する →</button>
        </div>
        <div style={{fontSize:10,color:C.sub,marginTop:8,lineHeight:1.6,textAlign:"center"}}>
          ※料金は税込・割引適用後の参考価格です。最新情報は各社公式サイトでご確認ください。（この情報は2026年7月7日時点のものです）
          ※本サイトは事業者からのアフィリエイト成果報酬によって運営しております。
        </div>
        <div style={{textAlign:"center",marginTop:12,display:"flex",justifyContent:"center",gap:20}}>
          <a href="https://docs.google.com/forms/d/e/1FAIpQLSe89nBA8-l6rjiusEgNpRuYgNMLku5Fn_OovoMK4pmJSub6eQ/viewform?usp=publish-editor" target="_blank" rel="noopener noreferrer" style={{fontSize:11,color:C.sub,textDecoration:"none"}}>
            📩 お問い合わせ
          </a>
          <button onClick={()=>setShowPrivacy(true)} style={{fontSize:11,color:C.sub,background:"none",border:"none",cursor:"pointer",fontFamily:"inherit",padding:0}}>
            🔒 プライバシーポリシー
          </button>
        </div>
      </div>
      <TabBar/>
      {showPrivacy && <PrivacyModal onClose={()=>setShowPrivacy(false)}/>}
    </div>
  );

  // QUIZ
  if (screen==="quiz") {
    const q = QUESTIONS[step];
    const prog = (step/QUESTIONS.length)*100;
    return (
      <div style={W}>
        <div style={{height:3,background:C.border}}>
          <div style={{height:"100%",width:`${prog}%`,background:C.accent,transition:"width 0.3s"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 16px 0",fontSize:11,color:C.sub}}>
          <span>質問 {step+1} / {QUESTIONS.length}</span>
          <span style={{display:"flex",gap:4}}>
            {QUESTIONS.map((_,i)=>(
              <span key={i} style={{width:6,height:6,borderRadius:"50%",background:i<=step?C.accent:C.border,opacity:i<step?0.4:1,display:"inline-block"}}/>
            ))}
          </span>
        </div>
        <div style={{padding:"28px 20px"}}>
          <div style={{fontSize:10,color:C.accent,fontWeight:700,letterSpacing:2,marginBottom:8}}>{q.sub}</div>
          <div style={{fontSize:20,fontWeight:900,lineHeight:1.4,marginBottom:24}}>{q.q}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            {q.opts.map(opt=>(
              <button key={opt.val} onClick={()=>answer(opt.val)} style={{
                background:C.card,border:`1px solid ${C.border}`,borderRadius:12,
                padding:"18px 10px",cursor:"pointer",color:C.text,
                fontFamily:"inherit",textAlign:"center",
              }}>
                <div style={{fontSize:28,marginBottom:8}}>{opt.icon}</div>
                <div style={{fontSize:12,fontWeight:700,lineHeight:1.4}}>{opt.label}</div>
              </button>
            ))}
          </div>
          {step>0&&(
            <button onClick={()=>setStep(step-1)} style={{
              marginTop:16, width:"100%", padding:"14px",
              borderRadius:12, border:`1px solid ${C.border}`,
              background:C.card2, color:C.sub,
              fontSize:14, fontWeight:700, cursor:"pointer", fontFamily:"inherit",
            }}>← もどる</button>
          )}
        </div>
        {step===3&&<AdBanner slotKey="mid"/>}
        <TabBar/>
      </div>
    );
  }

  // LOADING
  if (screen==="loading") return (
    <div style={{...W,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:16,minHeight:"100vh"}}>
      <div style={{fontSize:44}}>🤖</div>
      <div style={{fontSize:16,fontWeight:700}}>AIが分析中…</div>
      <div style={{fontSize:12,color:C.sub}}>最適なプランを計算しています</div>
    </div>
  );

  // RESULT
  return (
    <div style={W}>
      <div style={{
        padding:"20px 16px 16px",
        background:`linear-gradient(180deg,${C.accentG} 0%,transparent 100%)`,
        borderBottom:`1px solid ${C.border}`,marginBottom:8,
      }}>
        <div style={{fontSize:10,color:C.accent,fontWeight:700,letterSpacing:2,marginBottom:6}}>診断結果</div>
        {aiData?(
          <>
            <div style={{fontSize:22,fontWeight:900,marginBottom:6}}>{aiData.headline}</div>
            <div style={{fontSize:12,color:C.sub,lineHeight:1.7}}>{aiData.summary}</div>
          </>
        ):(
          <div style={{fontSize:20,fontWeight:900}}>あなたへのおすすめ Top {results.length}</div>
        )}
      </div>
      <AdBanner slotKey="result"/>
      <div style={{padding:"0 12px"}}>
        {results.map((plan,i)=>(
          <PlanCard key={plan.id} plan={plan} rank={i+1} comment={aiData?.comments?.[i]||""} answers={answers}/>
        ))}
      </div>
      <div style={{padding:"0 12px"}}>
        <button onClick={restart} style={{
          width:"100%",padding:"14px",borderRadius:10,
          border:`1px solid ${C.border}`,background:C.card,
          color:C.sub,fontSize:13,fontFamily:"inherit",cursor:"pointer",marginBottom:10,
        }}>もう一度診断する</button>
        <button onClick={()=>{ setTab("phone"); setPhoneScreen("top"); setPhoneSubTab("diagnose"); }} style={{
          width:"100%",padding:"14px",borderRadius:10,border:`1px solid ${C.accent}`,
          background:C.accentG,color:C.accent,fontSize:13,fontWeight:900,
          fontFamily:"inherit",cursor:"pointer",marginBottom:14,
        }}>📱 スマホも診断する →</button>
        <div style={{fontSize:10,color:C.sub,lineHeight:1.8,textAlign:"center",paddingBottom:20}}>
          ※料金は税込・割引適用後の参考価格です。<br/>
          ※最新・正確な情報は各社公式サイトでご確認ください。<br/>
          ※本サイトは事業者からのアフィリエイト成果報酬によって運営しております。
        </div>
      </div>
      <TabBar/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
